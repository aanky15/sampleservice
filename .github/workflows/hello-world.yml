name: Hello World

on:
  push:
  workflow_dispatch:
    inputs:
      environment: 
        description: 'Target environment'
        required: false
        default: 'Staging'
  pull_request:

jobs:
  hello:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run hello world app
        run: python app.py
