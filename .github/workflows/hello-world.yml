name: Hello World

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: false
        default: "Staging"
        type: string

      message:
        description: "Message from Port"
        required: false
        default: "Hello from Port"
        type: string

jobs:
  hello:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run hello world app
        run: python app.py

      - name: Show Port inputs
        run: |
          echo "Environment: ${{ inputs.environment }}"
          echo "Message: ${{ inputs.message }}"